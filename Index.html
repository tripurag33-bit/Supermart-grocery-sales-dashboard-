<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supermart Grocery Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px}h1{color:#0f172a}h1 span{color:#16a34a}.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpi{background:#fff;padding:15px;border-radius:12px;text-align:center}.kpi b{font-size:22px;display:block}select,input,button{padding:10px;margin:5px 0;width:100%;border-radius:8px;border:1px solid #cbd5e1}button{background:#16a34a;color:#fff;border:0;font-weight:bold}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#0f172a;color:#fff}</style></head>
<body>
<h1>🛒 Supermart <span>Grocery Sales Dashboard</span></h1>
<p>Analyze Sales, Profit, Products, Discounts & Geographic Performance</p>

<div class="grid">
<div class="kpi">Total Sales<b id="sales">₹0</b></div>
<div class="kpi">Total Profit<b id="profit">₹0</b></div>
<div class="kpi">Total Orders<b id="orders">0</b></div>
<div class="kpi">Avg Discount<b id="disc">0%</b></div>
</div>

<div class="card"><h3>Filter</h3>
<select id="filterCat" onchange="render()"><option value="All">All Categories</option><option>Dairy</option><option>Bakery</option><option>Beverages</option><option>Vegetables</option><option>Snacks</option></select>
<select id="filterCity" onchange="render()"><option value="All">All Cities</option><option>Shillong</option><option>Guwahati</option><option>Agartala</option><option>Aizawl</option></select>
</div>

<div class="card"><canvas id="chart"></canvas></div>

<div class="card"><h3>Add New Sale</h3>
<input id="p" placeholder="Product - e.g. Milk"><input id="c" placeholder="Category - Dairy"><input id="ct" placeholder="City - Shillong"><input id="sp" type="number" placeholder="Sales Amount"><input id="cp" type="number" placeholder="Cost Amount"><input id="d" type="number" placeholder="Discount %">
<button onclick="add()">+ Add Sale</button></div>

<div class="card"><h3>Sales Data</h3><table><thead><tr><th>Product</th><th>Category</th><th>City</th><th>Sales</th><th>Profit</th></tr></thead><tbody id="tbody"></tbody></table></div>

<script>
let data=[
{product:"Milk",cat:"Dairy",city:"Shillong",sales:2500,cost:1800,disc:5},
{product:"Bread",cat:"Bakery",city:"Guwahati",sales:1800,cost:1200,disc:10},
{product:"Rice 5kg",cat:"Grocery",city:"Agartala",sales:4200,cost:3200,disc:8},
{product:"Tea",cat:"Beverages",city:"Shillong",sales:3200,cost:2100,disc:12},
{product:"Potato",cat:"Vegetables",city:"Aizawl",sales:1500,cost:900,disc:3},
{product:"Chips",cat:"Snacks",city:"Guwahati",sales:2200,cost:1400,disc:15},
];
let chart;
function render(){
 let fc=document.getElementById("filterCat").value;
 let fcity=document.getElementById("filterCity").value;
 let f=data.filter(x=>(fc=="All"||x.cat==fc)&&(fcity=="All"||x.city==fcity));
 let s=0,p=0,d=0;
 let tb=document.getElementById("tbody"); tb.innerHTML="";
 f.forEach(x=>{let profit=x.sales-x.cost; s+=x.sales; p+=profit; d+=x.disc;
 tb.innerHTML+=`<tr><td>${x.product}</td><td>${x.cat}</td><td>${x.city}</td><td>₹${x.sales}</td><td>₹${profit}</td></tr>`});
 document.getElementById("sales").innerText="₹"+s.toLocaleString("en-IN");
 document.getElementById("profit").innerText="₹"+p.toLocaleString("en-IN");
 document.getElementById("orders").innerText=f.length;
 document.getElementById("disc").innerText=(f.length?Math.round(d/f.length):0)+"%";
 let cats={}; f.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.sales);
 if(chart) chart.destroy();
 chart=new Chart(document.getElementById("chart"),{type:"bar",data:{labels:Object.keys(cats),datasets:[{label:"Sales by Category",data:Object.values(cats),backgroundColor:"#16a34a"}]},options:{responsive:true,plugins:{title:{display:true,text:"Sales by Category"}}}});
}
function add(){
 let pr=document.getElementById("p").value, ca=document.getElementById("c").value||"Grocery", ci=document.getElementById("ct").value||"Shillong";
 let s=+document.getElementById("sp").value, c=+document.getElementById("cp").value, d=+document.getElementById("d").value||0;
 if(!pr||!s){alert("Enter Product and Sales");return;}
 data.push({product:pr,cat:ca,city:ci,sales:s,cost:c,disc:d}); render(); alert("Added!");
}
render();
</script></body></html>
